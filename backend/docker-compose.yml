services:
  db:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_USER: fireuser
      POSTGRES_PASSWORD: firepassword
      POSTGRES_DB: firedb
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
